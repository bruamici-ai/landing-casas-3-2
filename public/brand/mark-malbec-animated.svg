<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -6 80 58" style="color:#173d34;--brand-house:#661a30" role="img" aria-label="Experiencias Mendoza"><style>/* Architectural reveal: draw once, then alternate daylight and night. */
svg{--brand-cycle:24s;--brand-cycle-delay:1.2s}
.em-brand[data-tone="mono"]{--brand-moon:currentColor;--brand-light:currentColor;--brand-pool-light:currentColor;--brand-pool-lamp:currentColor;--brand-night-line:currentColor}
:is(.villa-roof,.villa-facade,.villa-glass,.villa-andes,.villa-pool,.vineyard-rows,.vineyard-posts){stroke-dasharray:1}
@keyframes em-draw{from{stroke-dashoffset:1;opacity:0}to{stroke-dashoffset:0;opacity:1}}
.villa-roof{animation:em-draw .4s cubic-bezier(.22,.61,.36,1) 0s 1 both}
.villa-facade{animation:em-draw .42s cubic-bezier(.22,.61,.36,1) .08s 1 both}
.villa-glass{animation:em-draw .3s cubic-bezier(.22,.61,.36,1) .2s 1 both}
.villa-andes{animation:em-draw .3s cubic-bezier(.22,.61,.36,1) .48s 1 both}
.villa-pool{animation:em-draw .25s cubic-bezier(.22,.61,.36,1) .6s 1 both}
.vineyard-rows{animation:em-draw .32s cubic-bezier(.22,.61,.36,1) .74s 1 both}
.vineyard-posts{animation:em-draw .25s cubic-bezier(.22,.61,.36,1) .94s 1 both}
:is(.villa-sun,.villa-moon){offset-path:path('M-31 29 A46.5 46.5 0 0 1 58 29');offset-rotate:0deg;offset-anchor:35px 3px}
.villa-sun{animation:em-day-sun var(--brand-cycle) linear var(--brand-cycle-delay) infinite both}
.villa-moon{animation:em-night-moon var(--brand-cycle) linear var(--brand-cycle-delay) infinite both}
:is(.villa-window-lights,.villa-pool-lights,.villa-pool-lamps){animation:em-night-lights var(--brand-cycle) ease-in-out var(--brand-cycle-delay) infinite both}
.villa-birds{animation:em-day-birds var(--brand-cycle) linear var(--brand-cycle-delay) infinite both}
:is(.villa-water,.villa-water-surface){animation:em-water-reveal .25s ease .78s 1 both}
@keyframes em-day-sun{0%{opacity:0;offset-distance:0%}1%,44%{opacity:1}45%,100%{opacity:0;offset-distance:100%}}
@keyframes em-night-moon{0%,50%{opacity:0;offset-distance:0%}51%,94%{opacity:1}95%,100%{opacity:0;offset-distance:100%}}
@keyframes em-night-lights{0%,35%{opacity:0}48%,84%{opacity:1}96%,100%{opacity:0}}
@keyframes em-day-birds{0%,10%{opacity:0;transform:translate(-4px,2px)}15%,26%{opacity:.85}32%,100%{opacity:0;transform:translate(3px,-2px)}}
@keyframes em-water-reveal{from{opacity:0}to{opacity:1}}
.em-brand[data-paused="true"] :is(path,circle,g){animation-play-state:paused!important}
.em-brand .em-brand__motion{border:1px solid currentColor;border-radius:6px;background:transparent;color:inherit;padding:8px 12px;font:500 11px/1.4 system-ui;cursor:pointer;min-height:36px}
.em-brand .em-brand__motion:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media(prefers-reduced-motion:reduce){
 :is(path,circle,g){animation:none!important;stroke-dasharray:none;stroke-dashoffset:0}
 :is(.villa-roof,.villa-facade,.villa-glass,.villa-andes,.villa-pool,.vineyard-rows,.vineyard-posts,.villa-sun,.villa-water,.villa-water-surface){opacity:1}
 :is(.villa-sun,.villa-birds){transform:none}
}
.em-brand .em-brand__art{display:block;width:100%;line-height:0}

/* Optional house color: landscape, pool and wordmark keep their own inks. */
.em-brand[data-house-color="malbec"][data-tone="dark"]{--brand-house:var(--brand-wine,#661a30)}

.villa-stars{animation:em-night-stars var(--brand-cycle) ease-in-out var(--brand-cycle-delay) infinite both}
@keyframes em-night-stars{0%,40%{opacity:0}49%{opacity:.8}58%{opacity:1}66%{opacity:.65}74%{opacity:.95}84%{opacity:.8}95%,100%{opacity:0}}

@media(prefers-reduced-motion:reduce){:is(.villa-sun,.villa-moon){offset-path:none;offset-distance:0%}}
</style><g class="brand-vineyard" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><g class="brand-villa" transform="translate(22 4) scale(.8)" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
<defs><clipPath id="brand-sun-horizon" clipPathUnits="userSpaceOnUse"><path fill="#fff" stroke="none" d="M-40-20H72V30L64 20 55 11 46 2 39 9 29 13 21 11 16 6 6 18-3 10-14 21-23 17-34 28-40 30Z"/></clipPath></defs>
<g class="villa-sun-horizon" clip-path="url(#brand-sun-horizon)"><circle class="villa-sun" cx="35" cy="3" r="4.5" fill="var(--brand-sun, #c99d4e)" stroke="none"/><path class="villa-moon" opacity="0" fill="var(--brand-moon, #718581)" stroke="none" d="M37-1A4.5 4.5 0 1 0 37 7A3.5 3.5 0 0 1 37-1Z"/></g>
<g class="villa-stars" opacity="0" stroke="var(--brand-stars, #7e9186)" stroke-width=".85" stroke-linecap="round" fill="none"><path d="M-20 4.4v3.2M-21.6 6h3.2M-4 .5v3M-5.5 2h3M21 2.4v3.2M19.4 4h3.2M57 1.5v3M55.5 3h3"/></g>
<path class="villa-andes" pathLength="1" stroke="var(--brand-mountain, #7e9186)" stroke-width="1.1" d="M-34 28-23 17-14 21-3 10 6 18 16 6 21 11M39 9l7-7 9 9 9 9"/>
<path class="villa-window-lights" opacity="0" fill="var(--brand-light, #ffe4a0)" stroke="none" d="M17 30h8v9h-8ZM27 30h9v9h-9ZM38 30h8v9h-8ZM35 20h4v4h-4ZM41 20h4v4h-4Z"/>
<path class="villa-roof" stroke="var(--brand-house, currentColor)" pathLength="1" stroke-width="2" d="M5 25h54M25 14h31M28 25V14h25v11"/>
<path class="villa-facade" stroke="var(--brand-house, currentColor)" pathLength="1" stroke-width="2" d="M9 25v15h46V25"/>
<path class="villa-glass" stroke="var(--brand-house, currentColor)" pathLength="1" stroke-width="1.35" d="M16 40V29h31v11M26 29v11M37 29v11M34 25V19h12v6M40 19v6"/>
<path class="villa-pool" pathLength="1" stroke-width="1.3" d="M9 44h52l-12 10H-3L9 44Z"/>
<path class="villa-water-surface" pathLength="1" stroke-width=".65" fill="var(--brand-water, #c4dfda)" d="M10.8 46h43.6l-7.2 6H3.6l7.2-6Z"/>
<path class="villa-pool-lights" opacity="0" stroke="none" fill="var(--brand-pool-light, #76dce1)" d="M10.8 46h43.6l-7.2 6H3.6l7.2-6Z"/><path class="villa-pool-lamps" opacity="0" stroke="var(--brand-pool-lamp, #e4ffff)" stroke-width="1" d="M15 46.8h4M28 46.8h4M41 46.8h4"/>
<path class="villa-water" pathLength="1" stroke-width=".85" d="M17 48q3-1.2 6 0t6 0M29 50q3-1.2 6 0t6 0"/>
</g>
<g class="villa-birds" opacity="0" stroke="var(--brand-mountain, #7e9186)" stroke-width="1.1"><path d="M17 9q2-2 4 0 2-2 4 0M22 15q1.5-1.5 3 0 1.5-1.5 3 0"/></g>
<g class="vineyard-trellis" transform="translate(-4 -6)" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
<path class="vineyard-rows" pathLength="1" stroke-width="1.15" d="M-2.5 49 21.5 29M3.5 49 23.9 32M9.5 49 25.1 36"/>
<path class="vineyard-posts" pathLength="1" stroke-width=".95" d="M-2.5 50v-3M3.5 45v-3M9.5 40v-3M15.5 35v-3M21.5 30v-3M3.5 50v-3M9.5 45v-3M15.5 40v-3M23.9 33v-3M9.5 50v-3M15.5 45v-3M21.5 40v-3M25.1 37v-3"/>
</g></g></svg>
